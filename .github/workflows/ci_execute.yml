name: "C/C++ build → Artifact (container minimal)"

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: [ "self-hosted", "ubuntu" ]

    container:
      image: ghcr.io/sinsan0209/devops-ci-image:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: "--volume /home/ubuntu/workspace/devops:/mnt/devops"

    steps:
      - name: "Checkout"
        uses: actions/checkout@v4

      - name: "Build (C/C++)"
        run: |
          mkdir -p build
          gcc -o build/hello src/hello.c
          g++ -o build/hello_cpp src/hello.cpp

      - name: "Run binaries"
        run: |
          ./build/hello
          ./build/hello_cpp

      - name: "Collect artifacts"
        if: ${{ always() }}
        run: |
          mkdir -p dist
          cp -f build/hello build/hello_cpp dist/ 2>/dev/null || true

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: "artifact-${{ github.run_number }}"
          path: "dist/**"
          if-no-files-found: error
          retention-days: 7
